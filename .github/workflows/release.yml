name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag wydania, np. v0.2.2 (musi zgadzać się z wersją w pyproject.toml)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('perception/detect.py', 'perception/depth.py') }}

      - name: Tag musi zgadzać się z wersją w pyproject.toml
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$VERSION" != "$TAG" ]; then
            echo "Tag $TAG != wersja v$VERSION w pyproject.toml" >&2
            exit 1
          fi

      - run: uv sync --frozen --extra ml --extra export --group dev
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run python scripts/evaluate.py --device cpu
      - run: uv run python scripts/export_onnx.py --out detr.onnx
      - run: uv build --wheel

      - name: Sumy kontrolne
        run: |
          cp dist/*.whl .
          sha256sum ./*.whl detr.onnx metrics.json > SHA256SUMS
          cat SHA256SUMS

      - name: Publikacja release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" ./*.whl detr.onnx metrics.json SHA256SUMS \
            --target "$GITHUB_SHA" --title "$TAG" --generate-notes
  image:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # metadata-action zamienia nazwę repo na małe litery (wymóg ghcr.io) i wylicza tagi
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ env.TAG }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max